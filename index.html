<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Max Ritter" />

    <!-- Default title; SEO meta is injected per-route by react-helmet-async at build time -->
    <title>Max Ritter &mdash; Data, Cloud &amp; AI Systems Engineer | IT Freelancer</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Preconnect to analytics (avoids late DNS/TCP/TLS) -->
    <link rel="preconnect" href="https://cloud.umami.is" crossorigin />
    <link rel="dns-prefetch" href="https://cloud.umami.is" />
    <link rel="preconnect" href="https://analytics.ahrefs.com" crossorigin />
    <link rel="dns-prefetch" href="https://analytics.ahrefs.com" />

    <!-- Preload the fonts the first paint needs (self-hosted, no CDN) -->
    <link rel="preload" as="font" href="/fonts/switzer-500.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/switzer-400.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/geist-mono.woff2" type="font/woff2" crossorigin />

    <!-- Ahrefs Analytics -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="S7mQfVA8T3L5sfBK66rWdA" async></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="38e8e2ed-2570-4034-8546-4a60c7b18ab0"></script>
  </body>
</html>
