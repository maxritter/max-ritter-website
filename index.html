<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Max Ritter" />

    <!-- Default title; SEO meta is injected per-route by react-helmet-async at build time -->
    <title>Max Ritter — IT Freelancer | Agentic Engineering &amp; Cloud</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Preconnect to analytics (avoids late DNS/TCP/TLS) -->
    <link rel="preconnect" href="https://cloud.umami.is" crossorigin />
    <link rel="dns-prefetch" href="https://cloud.umami.is" />
    <link rel="preconnect" href="https://analytics.ahrefs.com" crossorigin />
    <link rel="dns-prefetch" href="https://analytics.ahrefs.com" />

    <!-- Preload LCP image (hero profile picture) -->
    <link rel="preload" as="image" href="/profile.webp" type="image/webp" fetchpriority="high" />

    <!-- Ahrefs Analytics -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="S7mQfVA8T3L5sfBK66rWdA" async></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="38e8e2ed-2570-4034-8546-4a60c7b18ab0"></script>
  </body>
</html>
